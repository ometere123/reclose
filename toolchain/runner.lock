selection_rationale: |
  Two candidate sources disagreed: sdk.genlayer.com/main (S10, tracks the "main"/HEAD SDK branch) reported hash
  9b8kjyda2... as "current"; Studio-dev's own live v0.123.0-rc.6 environment and its bundled genvm-manager
  v0.6.0-rc3/rc4 release family both expose and only support hash 5jycge4q.... The S10 hash was proven NOT to
  exist/resolve anywhere in the genvm-manager v0.6.0-rc3/rc4 runner family (see step 4 above) - it belongs to a
  newer or differently-versioned runner set on the "main" branch that has not (yet) been shipped to the specific
  Studio-dev RC deployment Reclose targets. Per this record's own authority rule (Section 2.1): "verified live
  Studio-dev / chain 61997 behaviour with the exact pinned compatible RC stack outranks stale examples,
  remembered package versions and unverified notes." sdk.genlayer.com/main is, relative to this specific pinned
  RC family, exactly such an ahead-of-baseline / not-yet-verified source. The hash was NOT chosen because it is
  newer - it was chosen because it is the only one that is proven resolvable, stable across two release points,
  and independently corroborated by three separate tools/caches (genvm-linter, gltest-direct, and Studio-dev's
  own live template) against the exact RC family Studio-dev v0.123.0-rc.6 ships.
